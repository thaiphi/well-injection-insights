name: CI

# Full offline test gate (HANDOVER.md §6). The live Portfolio probe
# (scripts/check-portfolio.mjs) is excluded: tests make no network calls.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to the verified version. Node 24.22.x rejects trailing DEFLATE
          # data, which breaks the protected observation test at
          # swd-injection-analytics/tests/xlsx-boundary.test.mjs:268. Raise this
          # only through a reviewed preservation layer that updates that test.
          node-version: 24.13.0

      - uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      # Same single command as `npm test` locally (scripts/check-all.mjs):
      # preservation gate, app assembly, root tests, vitest, both type checks,
      # site build, and the isolated engineering suite with carried oracles.
      - name: Full offline test gate
        run: node scripts/check-all.mjs

      - name: Upload gate record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-gates
          path: tmp/analytics-check-*/gates.json
          if-no-files-found: ignore

  # Standalone Analytics image (Zoomcamp ZC-02): build the repo-root Dockerfile,
  # wait for its HEALTHCHECK, then check key routes, POST refusal and non-root user.
  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build and smoke-test the image
        run: bash scripts/docker-smoke.sh
